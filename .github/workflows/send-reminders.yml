name: Send Reminder Notifications

on:
  schedule:
    # GitHub runs this in UTC; the job reads the current Vietnam hour below.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Only send a test push to this user email'
        required: false
        type: string
      broadcast_test:
        description: 'Send a test push to all subscribed devices'
        required: false
        type: boolean
        default: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Check Vietnam time
        id: timezone
        run: |
          CURRENT_HOUR=$(TZ='Asia/Ho_Chi_Minh' date +%H):00
          CURRENT_MINUTE=$(TZ='Asia/Ho_Chi_Minh' date +%M)
          echo "Current Vietnam time: $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S')"
          echo "hour=$CURRENT_HOUR" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_MINUTE" -gt 5 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send to subscribed users
        if: steps.timezone.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.test_email == '')
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: |
          CURRENT_HOUR="${{ steps.timezone.outputs.hour }}"
          RESPONSE=$(curl -sS -X POST https://api.onesignal.com/notifications \
            -H "Content-Type: application/json" \
            -H "Authorization: Key $ONESIGNAL_API_KEY" \
            -d "{
              \"app_id\": \"$ONESIGNAL_APP_ID\",
              \"filters\": [
                {\"field\": \"tag\", \"key\": \"reminder_enabled\", \"relation\": \"=\", \"value\": \"true\"},
                {\"operator\": \"AND\"},
                {\"field\": \"tag\", \"key\": \"reminder_time\", \"relation\": \"=\", \"value\": \"$CURRENT_HOUR\"}
              ],
              \"headings\": {\"en\": \"VocabMaster\"},
              \"contents\": {\"en\": \"Đã đến giờ ôn tập từ vựng! Hãy dành 5 phút để học nhé 🔥\"},
              \"url\": \"https://vocabulary.click\",
              \"ttl\": 3600,
              \"priority\": 10
            }")

          echo "$RESPONSE"
          if ! echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "OneSignal rejected the reminder request"
            exit 1
          fi

      - name: Send targeted test notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_email != ''
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          TEST_EMAIL=$(printf '%s' "$TEST_EMAIL" | tr '[:upper:]' '[:lower:]')
          RESPONSE=$(curl -sS -X POST https://api.onesignal.com/notifications \
            -H "Content-Type: application/json" \
            -H "Authorization: Key $ONESIGNAL_API_KEY" \
            -d "{
              \"app_id\": \"$ONESIGNAL_APP_ID\",
              \"include_aliases\": {\"email\": [\"$TEST_EMAIL\"]},
              \"target_channel\": \"push\",
              \"headings\": {\"en\": \"VocabMaster test\"},
              \"contents\": {\"en\": \"Đây là thông báo thử nghiệm. Hãy kiểm tra khi app đang đóng nhé!\"},
              \"url\": \"https://vocabulary.click\",
              \"ttl\": 3600,
              \"priority\": 10
            }")

          echo "$RESPONSE"
          echo "OneSignal recipients: $(echo "$RESPONSE" | jq -r '.recipients // 0')"
          if ! echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "OneSignal rejected the targeted test request"
            exit 1
          fi

      - name: Send broadcast test notification
        if: github.event_name == 'workflow_dispatch' && inputs.broadcast_test == true
        env:
          ONESIGNAL_API_KEY: \${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: \${{ secrets.ONESIGNAL_APP_ID }}
        run: |
          RESPONSE=$(curl -sS -X POST https://api.onesignal.com/notifications \
            -H "Content-Type: application/json" \
            -H "Authorization: Key $ONESIGNAL_API_KEY" \
            -d "{
              \"app_id\": \"$ONESIGNAL_APP_ID\",
              \"included_segments\": [\"Subscribed Users\"],
              \"target_channel\": \"push\",
              \"headings\": {\"en\": \"VocabMaster test\"},
              \"contents\": {\"en\": \"Thông báo test VocabMaster. Nếu bạn thấy tin này, push notification đang hoạt động!\"},
              \"url\": \"https://vocabulary.click\",
              \"ttl\": 3600,
              \"priority\": 10
            }")

          echo "$RESPONSE"
          echo "OneSignal recipients: $(echo "$RESPONSE" | jq -r '.recipients // 0')"
          if ! echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "OneSignal rejected the broadcast test request"
            exit 1
          fi
